version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: biotrack_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-design.nousha}
      POSTGRES_DB: ${POSTGRES_DB:-biotrack_ems}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biotrack_ems"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: biotrack_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: biotrack_backend
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:design.nousha@postgres:5432/biotrack_ems?schema=public}
      JWT_SECRET: ${JWT_SECRET:-biotrack_ems_jwt_secret_key_123!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-biotrack_ems_jwt_refresh_secret_key_456!}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: biotrack_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata: