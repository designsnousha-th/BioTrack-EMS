version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: biotrack_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: design.nousha
      POSTGRES_DB: biotrack_ems
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: biotrack_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: biotrack_backend
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:design.nousha@postgres:5432/biotrack_ems?schema=public"
      JWT_SECRET: "biotrack_ems_jwt_secret_key_123!"
      JWT_REFRESH_SECRET: "biotrack_ems_jwt_refresh_secret_key_456!"
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: biotrack_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
